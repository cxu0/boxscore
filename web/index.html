<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxscore</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
      background: #0d0d0d; color: #fff; text-align: center; }
    .card { padding: 2rem; max-width: 380px; }
    h1 { font-size: 2.5rem; letter-spacing: -0.02em; color: #FF5F1F; margin: 0 0 .5rem; }
    p { color: #b8b8b8; line-height: 1.5; }
    .code { font-size: 2rem; font-weight: 800; letter-spacing: .3em; margin: 1.25rem 0;
      padding: .75rem 1rem; background: #1c1c1c; border-radius: 12px; }
    a.btn { display: inline-block; margin-top: 1rem; background: #FF5F1F; color: #fff;
      text-decoration: none; font-weight: 700; padding: .85rem 1.5rem; border-radius: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BOXSCORE</h1>
    <p>Open this in the Boxscore app to continue. Don't have it yet? Get the app, then enter this code:</p>
    <div class="code" id="code">—</div>
    <a class="btn" href="#" id="store">Get Boxscore</a>
  </div>
  <script>
    // Show the code from the path (/join/CODE, /keeper/CODE) as a manual fallback.
    var parts = location.pathname.split('/').filter(Boolean);
    var el = document.getElementById('code');
    if (parts.length >= 2 && (parts[0] === 'join' || parts[0] === 'keeper')) {
      el.textContent = parts[1].toUpperCase();
    } else {
      el.style.display = 'none';
    }
    // TODO: set the App Store URL once the app is published.
    document.getElementById('store').href = 'https://apps.apple.com/';
  </script>
</body>
</html>
